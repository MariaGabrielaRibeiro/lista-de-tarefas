<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>📝 Minhas Tarefas</h1>

    <div class="entrada">
      <input type="text" id="campo-tarefa" placeholder="O que precisa ser feito?" />
      <!-- Melhoria 4: Select de prioridade -->
      <select id="select-prioridade" title="Prioridade da tarefa">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
      <button id="btn-adicionar">Adicionar</button>
    </div>

    <!-- Melhoria 3: Contagem regressiva de caracteres -->
    <p id="contador-caracteres" class="info-caracteres">100 caracteres restantes</p>

    <!-- Melhoria 2: Filtros de visualização -->
    <div class="filtros">
      <button class="btn-filtro ativo" data-filtro="todas">Todas</button>
      <button class="btn-filtro" data-filtro="pendentes">Pendentes</button>
      <button class="btn-filtro" data-filtro="concluidas">Concluídas</button>
    </div>

    <div class="barra-status">
      <p id="contador"></p>
      <!-- Melhoria 1: Botão Limpar concluídas -->
      <button id="btn-limpar">Limpar concluídas</button>
    </div>

    <ul id="lista-tarefas"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
